<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OddLab IA</title>
<meta name="description" content="IA de análise e sinais de totais (over/under) para futebol, basquete e hóquei com dados ao vivo da ESPN e aprendizado contínuo.">
<meta name="theme-color" content="#080b11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffc53d'/%3E%3Cpath d='M7 22l6-7 4 4 8-10' stroke='%231d1400' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..900&family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=5">
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">OL</div>
      <div>
        <div class="brand-name">Odd<span>Lab</span> IA</div>
        <div class="brand-sub">Totais · Futebol · NBA · NHL</div>
      </div>
    </div>
    <nav class="nav" id="nav" role="tablist" aria-label="Seções"></nav>
    <div class="side-foot">
      Dados: API pública ESPN<br>
      Odds de referência: provedor exibido pela ESPN<br>
      <span id="foot-cycle">—</span>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <header class="topbar">
        <div class="grow">
          <h1 id="page-title">Painel</h1>
          <div class="sub" id="page-sub">Carregando o cérebro da IA…</div>
        </div>
        <div class="pulse-pill" id="pulse"><span class="dot" id="pulse-dot"></span><span id="pulse-text">conectando</span></div>
        <div class="seg" id="sport-seg" role="group" aria-label="Esporte">
          <button data-sport="all" aria-pressed="true">Todos</button>
          <button data-sport="soccer" aria-pressed="false">Futebol</button>
          <button data-sport="basketball" aria-pressed="false">Basquete</button>
          <button data-sport="hockey" aria-pressed="false">Hóquei</button>
        </div>
        <button class="icon-btn" id="theme-btn" title="Alternar tema" aria-label="Alternar tema">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
      </header>
      <section id="view" aria-live="polite"></section>
    </div>
  </main>
</div>
<div id="drawer-root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
